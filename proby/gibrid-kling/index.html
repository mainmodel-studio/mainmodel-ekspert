const P2_0 = SEG1 * .97;          // часть 2 стартует, когда атом гостиной ушёл (p1 = .97)
const V_END = .55;                // часть 1: видео на p1 0 … .55, дальше держит последний кадр
const ATOM_A = .47, ATOM_B = .96; // часть 1: атом стартует на влёте (стык 4,3–4,7 с закрыт вспышкой)
const V2_END = .40, ATOM2_A = .33, ATOM2_B = .97; // часть 2 (q): видео поворота, атом кухни с конца поворота
let dur = 5.04, dur2 = 5.04, k = 1, ox = 0, oy = 0, dpr = 1, vis = { x0: 0, y0: 0, x1: W, y1: H };

// толчок на кадре 79→80), поэтому линейная связь давала ступеньки. До влёта (p 0…ATOM_A ↔ 0…4,31 с)
// время идёт по накопленному приближению кадров (ORB-замер, вес = zoom% + 0,6, медиана по 3 кадрам — держит толчок 79→80 без всплеска);

const T_IN = 4.31;

function videoTime(p) {
  if (p >= ATOM_A) return Math.min(dur, T_IN + (dur - T_IN) * clamp((p - ATOM_A) / (V_END - ATOM_A)));
  const q = clamp(p / ATOM_A); let lo = 0, hi = LUT.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (LUT[m] <= q) lo = m; else hi = m; }

}
// поворот: камера стоит на краях и разгоняется до ×9 в середине (оптический поток по кадрам) —
// вес кадра = поток + 1,5: середина растянута по прокрутке, мягкий разгон и торможение сохранены
const LUT2 = [0.0000, 0.0027, 0.0066, 0.0105, 0.0143, 0.0181, 0.0219, 0.0260, 0.0300, 0.0343, 0.0388, 0.0436, 0.0486, 0.0537, 0.0588, 0.0641, 0.0697, 0.0755, 0.0816, 0.0881, 0.0949, 0.1021, 0.1099, 0.1180, 0.1266, 0.1355, 0.1450, 0.1549, 0.1653, 0.1762, 0.1872, 0.1982, 0.2096, 0.2216, 0.2339, 0.2464, 0.2593, 0.2726, 0.2863, 0.2997, 0.3132, 0.3268, 0.3409, 0.3549, 0.3691, 0.3835, 0.3979, 0.4120, 0.4264, 0.4409, 0.4552, 0.4693, 0.4836, 0.4979, 0.5129, 0.5285, 0.5436, 0.5587, 0.5735, 0.5881, 0.6025, 0.6164, 0.6306, 0.6444, 0.6576, 0.6705, 0.6828, 0.6946, 0.7061, 0.7168, 0.7262, 0.7346, 0.7429, 0.7512, 0.7600, 0.7686, 0.7774, 0.7860, 0.7946, 0.8032, 0.8121, 0.8204, 0.8282, 0.8354, 0.8420, 0.8484, 0.8547, 0.8608, 0.8668, 0.8728, 0.8785, 0.8841, 0.8893, 0.8947, 0.8999, 0.9050, 0.9101, 0.9152, 0.9202, 0.9252, 0.9300, 0.9346, 0.9392, 0.9436, 0.9479, 0.9520, 0.9559, 0.9596, 0.9633, 0.9668, 0.9702, 0.9736, 0.9769, 0.9802, 0.9833, 0.9863, 0.9892, 0.9920, 0.9947, 0.9974, 1.0000];
121
function videoTime2(q) {
  const u = clamp(q / V2_END); let lo = 0, hi = LUT2.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (LUT2[m] <= u) lo = m; else hi = m; }
  return Math.min(dur2 - .001, (lo + (u - LUT2[lo]) / ((LUT2[hi] - LUT2[lo]) || 1)) / 24);
}

// ── видео: грузим целиком в blob, чтобы скраб не ждал сеть ──
async function fetchBlob(url, onPct) {
  try {
    const r = await fetch(url);
    const total = +r.headers.get('content-length') || 0, rd = r.body.getReader(), parts = []; let got = 0;
    for (;;) { const { done, value } = await rd.read(); if (done) break; parts.push(value); got += value.length;
      if (total) onPct(Math.round(got / total * 100)); }
    return URL.createObjectURL(new Blob(parts, { type: 'video/mp4' }));
  } catch (e) { return url; }
}
const ready = v => new Promise(res => v.readyState >= 2 ? res() : v.addEventListener('loadeddata', res, { once: true }));
async function loadVideo() {
  vid.src = await fetchBlob(VIDEO, n => load.textContent = 'ЗАГРУЗКА ' + n + '%');
  vid.play().then(() => { vid.pause(); s1.go(s1.want); }).catch(() => {}); // iOS Safari: без play() может не отдать первый кадр
  await ready(vid);
  dur = vid.duration || dur; load.remove(); poster.remove(); // сразу, без затухания: ни след «ЗАГРУЗКИ», ни постер (кадр фасада) не должны двоиться с текущим кадром
}
let ready2 = false;
async function loadVideo2() { // часть 2 грузится фоном, пока смотрят гостиную
  vid2.src = await fetchBlob(VIDEO2, n => load2.textContent = 'КУХНЯ ' + n + '%');
  vid2.play().then(() => { vid2.pause(); s2.go(s2.want); }).catch(() => {});
  await ready(vid2); dur2 = vid2.duration || dur2; ready2 = true; window.__ready2 = true; render(cur);
}

// ── телефон: кадры-картинки на холсте, между соседними кадрами — смешивание ──
const NF = 121, FR = 24, NF2 = 358, FR2 = 72, frames1 = [], frames2 = [], seqCv = $('#seq'), sctx = seqCv.getContext('2d');
let lastKey = '';
function loadSet(dir, arr, onPct, NF = 121) {
  let got = 0, next = 0;
  const one = i => new Promise(res => { const im = new Image(); arr[i] = im;
    im.onload = im.onerror = () => { got++; onPct(Math.round(got / NF * 100)); res(); };
    im.src = dir + '/' + String(i).padStart(3, '0') + '.webp'; });
  return Promise.all(Array.from({ length: 6 }, async () => { while (next < NF) await one(next++); }));
}
async function loadFrames() {
  await loadSet('frames-m', frames1, n => load.textContent = 'ЗАГРУЗКА ' + n + '%');
  dur = NF / FR; vid.remove(); vid2.remove(); load.remove(); poster.remove();
}
async function loadFrames2() {
  await loadSet('frames-m3', frames2, n => load2.textContent = 'КУХНЯ ' + n + '%', NF2);
  dur2 = NF2 / FR2; ready2 = true; window.__ready2 = true; lastKey = ''; render(cur);
}
function drawSeq(set, id, vt) {
  const n = id === 1 ? NF : NF2, f = clamp(vt * (id === 1 ? FR : FR2), 0, n - 1), key = id + ':' + f.toFixed(2); if (key === lastKey) return; lastKey = key;
  const i = id === 1 ? Math.floor(f) : Math.round(f), a = f - i;
  sctx.setTransform(dpr * k, 0, 0, dpr * k, dpr * ox, dpr * oy);
  sctx.globalAlpha = 1; if (set[i]?.complete) sctx.drawImage(set[i], 0, 0, W, H);
  // поворот на кухню быстрый: смешивание дало бы двойной контур — там ближайший кадр
  if (id === 1 && a > .03 && set[i + 1]?.complete) { sctx.globalAlpha = a; sctx.drawImage(set[i + 1], 0, 0, W, H); }
}

// ── скраб: одна перемотка за раз, последняя цель не теряется ──
function seeker(v) {
  const s = { want: 0, busy: false };
  s.go = t => { s.want = t; if (!s.busy && v.readyState >= 1 && Math.abs(v.currentTime - t) > .02) { s.busy = true; v.currentTime = t; } };
  v.addEventListener('seeked', () => { s.busy = false; if (Math.abs(v.currentTime - s.want) > .02) s.go(s.want); });
  return s;
}
const s1 = seeker(vid), s2 = seeker(vid2);

function placeCta() {
  const r = ctaRect(vis);
  Object.assign(cta.style, { left: ox + r.x * k + 'px', top: oy + r.y * k + 'px', width: r.w * k + 'px', height: r.h * k + 'px', fontSize: Math.max(12, r.fs * k) + 'px' });
}
function resize() {
  dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  if (MOBILE) { seqCv.width = cv.width; seqCv.height = cv.height; lastKey = ''; }
  k = Math.max(innerWidth / W, innerHeight / H); ox = (innerWidth - W * k) / 2; oy = (innerHeight - H * k) / 2;
  vis = { x0: -ox / k, y0: -oy / k, x1: W + ox / k, y1: H + oy / k };
  placeCta(); render(cur, true);
}
addEventListener('resize', resize);

function render(p) {
  const p1 = p / SEG1, q = (p - P2_0) / (1 - P2_0), inB = q > 0, showB = inB && ready2;
  const vt = videoTime(Math.min(p1, 1)), vt2 = videoTime2(q);
  if (MOBILE) { if (showB) drawSeq(frames2, 2, vt2); else drawSeq(frames1, 1, vt); }
  else {
    vid2.style.visibility = showB ? 'visible' : 'hidden';
    if (showB) s2.go(vt2); else s1.go(vt - (p1 >= V_END ? .001 : 0));
  }
  load2.style.opacity = inB && !ready2 ? 1 : 0; // долистали до кухни раньше, чем она загрузилась
  // вспышка влёта: свет из окна закрывает стык 4,3–4,7 с (импост и картина) — по реальному времени видео
  flash.style.opacity = (clamp((1 - Math.abs(vt - 4.54) / .38) * 1.6) ** .7 * .94).toFixed(3); // плато 4,40–4,68 с

  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  const ta = T_END * clamp((p1 - ATOM_A) / (ATOM_B - ATOM_A)), ta2 = T2_END * clamp((q - ATOM2_A) / (ATOM2_B - ATOM2_A));
  ctx.setTransform(dpr * k, 0, 0, dpr * k, dpr * ox, dpr * oy);
  if (p1 > ATOM_A && !inB) drawAtom(ctx, ta, vis);
  if (showB) drawTurn(ctx, vt2, vis);
  if (q > ATOM2_A) drawAtom2(ctx, ta2, vis);

  const loc = h => h.seg === 2 ? q : p1;
  const vis2 = h => sm((loc(h) - h.from) / .03) * (1 - sm((loc(h) - h.to + .06) / .03));
  scrim.style.opacity = Math.max(...heads.map(vis2));
  for (const h of heads) {
    const span = h.to - h.from, x = loc(h);
    h.cap.style.opacity = h.seg === 2 ? vis2(h) * (1 - sm((x - h.to + .085) / .02)) : vis2(h); // подпись поворота гаснет до ухода строк
    h.spans.forEach((s, j) => {
      const a = eo((x - h.from - j * .012) / (span * .35));
      const e = eo((x - h.to + .045 - j * .008) / .045);
      s.style.transform = `translateY(${((1 - a) * 110 - e * 150).toFixed(2)}%)`;
      s.style.opacity = (1 - sm(e * 2.6)).toFixed(3); // уходящая строка гаснет быстро — без следа на фасаде
    });
  }
  const d = Math.round(240 * (1 - clamp(p1 / .46)));
  distN.firstChild.nodeValue = String(d).padStart(3, '0');
  distEl.style.opacity = 1 - sm((p1 - .40) / .05);
  bar.style.opacity = 1 - sm((p1 - .44) / .04);           // внутри бренд несёт метка атома
  note.style.opacity = (MOBILE ? 1 : .7) * (1 - sm((p1 - .44) / .04));
  hint.style.opacity = 1 - sm(p1 / .03);
  const c = sm((ta2 - 8.15) / .4);
  cta.style.opacity = c; cta.classList.toggle('on', c > .5);
  prog.style.width = (p * 100).toFixed(2) + '%';
}

let tgt = 0, cur = 0;
const readScroll = () => { const m = document.documentElement.scrollHeight - innerHeight; tgt = m > 0 ? clamp(scrollY / m) : 0; };
addEventListener('scroll', readScroll, { passive: true });
function loop() {
  const d = tgt - cur;
  if (Math.abs(d) > 1e-5) { cur += d * .1; render(cur); }
  requestAnimationFrame(loop);
}
// для проверки кадров: прыжок к прогрессу p, промис ждёт готовый кадр видео
window.__jump = p => new Promise(res => {
  const m = document.documentElement.scrollHeight - innerHeight; scrollTo(0, p * m); tgt = cur = p; render(p);
  const done = () => (s1.busy || s2.busy ? setTimeout(done, 30) : requestAnimationFrame(() => requestAnimationFrame(() => res(true))));
  done();
});
cta.addEventListener('click', () => alert('Это проба: запись на просмотр появится на настоящем сайте.'));

Promise.all([document.fonts.ready, MOBILE ? loadFrames() : loadVideo()]).then(() => {
  readScroll(); cur = tgt; resize(); requestAnimationFrame(loop); window.__ready = true;
  MOBILE ? loadFrames2() : loadVideo2();
});
resize();
</script>
</body>
