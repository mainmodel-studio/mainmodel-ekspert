<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 10 10%22%3E%3Crect width=%2210%22 height=%2210%22 fill=%22%23E78636%22/%3E%3C/svg%3E">
<title>ЖК ЛИНИЯ · квартира 9.04 — проба гибрида Kling</title>
<style>
  :root { --por:#F0EEE6; --gr:#222522; --gn:#416B53; --or:#E78636;
    --heavy: 800 1em Futura,"Avenir Next","Arial Black",sans-serif;
    --mono: "PT Mono",Menlo,Consolas,monospace; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #1a1c1a; color: var(--gr); }
  body { font-family: var(--mono); -webkit-font-smoothing: antialiased; }
  html { scrollbar-width: none; } html::-webkit-scrollbar { display: none; }
  #scroller { height: 660vh; position: relative; }
  #stage { position: sticky; top: 0; height: 100vh; height: 100dvh; width: 100%; overflow: hidden; }
  #vid, #seq, #atom, #poster, #poster img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #vid, #poster img { object-fit: cover; }
  #flash { position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(70% 70% at 50% 48%, #FFFEFA 0%, #FFF4DF 38%, #F8E1BD 75%, #EFCFA2 100%); }

  #bar { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: center;
    padding: 22px 4vw 34px; font-size: 13px; letter-spacing: .14em; z-index: 5;
    background: linear-gradient(rgba(240,238,230,.9), rgba(240,238,230,.55) 70%, rgba(240,238,230,0)); }
  #bar b { font: var(--heavy); font-size: 22px; letter-spacing: .04em; }
  #bar b i { font-style: normal; color: var(--or); }
  #progress { position: absolute; left: 0; top: 0; height: 3px; background: var(--or); width: 0; z-index: 6; }

  /* моушн-заголовки: строки поднимаются из маски */
  .hd { position: absolute; z-index: 4; pointer-events: none; left: 4vw; top: 14vh; }
  .hd .cap { font-size: 13px; letter-spacing: .18em; margin-bottom: 18px; opacity: 0; display: flex; gap: 14px; align-items: center; }
  .hd .cap::before { content: ""; width: 34px; height: 3px; background: var(--or); display: inline-block; }
  .hd .ln { overflow: hidden; line-height: .98; padding-bottom: .06em; }
  .hd .ln span { display: block; font: var(--heavy); font-size: clamp(40px, 5.6vw, 100px); letter-spacing: -.01em; transform: translateY(110%); will-change: transform; }
  .hd .ln.acc span { color: var(--or); }
  .scrim { position: absolute; inset: 0; pointer-events: none; z-index: 3; opacity: 0;
    background: radial-gradient(120% 90% at 0% 0%, rgba(240,238,230,.95) 0%, rgba(240,238,230,.86) 38%, rgba(240,238,230,0) 70%); }

  /* счётчик «до окна» */
  #dist { position: absolute; right: 4vw; bottom: 9vh; z-index: 4; text-align: right; font-size: 13px; letter-spacing: .16em; color: var(--por);
    background: rgba(34,37,34,.62); padding: 14px 20px 12px; }
  #dist .n { font: var(--heavy); font-size: clamp(40px, 5vw, 84px); letter-spacing: 0; font-variant-numeric: tabular-nums; display: block; line-height: 1; margin-top: 6px; }
  #dist .n i { font-style: normal; opacity: .55; font-size: .5em; margin-left: .15em; }

  #hint { position: absolute; left: 50%; bottom: 3.2vh; transform: translateX(-50%); font-size: 12px; letter-spacing: .2em; z-index: 4; color: var(--por);
    text-shadow: 0 1px 8px rgba(0,0,0,.5); }
  #note { position: absolute; left: 4vw; bottom: 3vh; font-size: 11px; letter-spacing: .12em; z-index: 4; color: var(--por); opacity: .7;
    text-shadow: 0 1px 8px rgba(0,0,0,.5); }
  #cta { position: absolute; left: 0; top: 0; z-index: 7; font: var(--heavy); letter-spacing: .03em;
    background: var(--or); color: var(--por); border: 0; cursor: pointer; opacity: 0; pointer-events: none; transition: background .2s; white-space: nowrap; }
  #cta:hover { background: var(--gn); }
  #cta.on { pointer-events: auto; }
  #load { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 9; font-size: 12px; letter-spacing: .2em; color: var(--por);
    background: rgba(34,37,34,.8); padding: 14px 22px; transition: opacity .3s; }
  /* телефон / узкий экран: лёгкая вертикальная последовательность кадров (frames-m/, вместо видео — iOS медленно перематывает) и раскладка атома */
  @media (max-aspect-ratio: 4/5), (max-width: 699px) {
    #bar { padding: 16px 5vw 28px; font-size: 10px; letter-spacing: .1em; }
    #bar b { font-size: 19px; }
    .hd { left: 5vw; top: 13vh; }
    .hd .cap { font-size: 11px; letter-spacing: .14em; margin-bottom: 14px; }
    .hd .ln span { font-size: clamp(36px, 11.5vw, 64px); }
    #dist { right: 5vw; bottom: 8vh; padding: 10px 14px 9px; font-size: 11px; }
    #dist .n { font-size: clamp(36px, 11vw, 60px); }
    #hint { bottom: 2.6vh; }
    #note { left: 5vw; bottom: auto; top: 64px; font-size: 10px; background: rgba(34,37,34,.6); padding: 5px 8px 4px; text-shadow: none; }
    .scrim { background: radial-gradient(170% 75% at 0% 0%, rgba(240,238,230,.95) 0%, rgba(240,238,230,.86) 45%, rgba(240,238,230,0) 78%); }
  }
</style>
</head>
<body>
<div id="scroller">
  <div id="stage">
    <video id="vid" muted playsinline preload="auto"></video>
    <canvas id="seq"></canvas>
    <picture id="poster"><source media="(max-aspect-ratio: 4/5), (max-width: 699px)" srcset="poster-m.jpg"><img src="poster.jpg" alt=""></picture>
    <div id="flash"></div>
    <div class="scrim" id="scrim"></div>
    <canvas id="atom"></canvas>
    <div id="progress"></div>
    <div id="bar"><b>ЛИНИЯ<i>.</i></b><span>ЖИЛОЙ КВАРТАЛ У ПАРКА</span></div>

    <div class="hd" id="h1" data-from="-0.12" data-to="0.20">
      <div class="cap">ЖК ЛИНИЯ · КВАРТАЛ У ПАРКА</div>
      <div class="ln"><span>ДОМ, ГДЕ</span></div>
      <div class="ln acc"><span>СОЛНЦЕ</span></div>
      <div class="ln"><span>ДО ВЕЧЕРА.</span></div>
    </div>
    <div class="hd" id="h2" data-from="0.215" data-to="0.40">
      <div class="cap">9 ЭТАЖ · ОКНА НА ЗАПАД</div>
      <div class="ln"><span>ЗАГЛЯНИТЕ</span></div>
      <div class="ln acc"><span>В ОКНО.</span></div>
    </div>

    <div id="dist">ДО ОКНА<span class="n">240<i>М</i></span></div>
    <div id="hint">ЛИСТАЙТЕ ↓</div>
    <div id="note">ПРОБА · ЖК И ЦИФРЫ ВЫДУМАНЫ</div>
    <button id="cta" type="button">ЗАПИСАТЬСЯ НА ПРОСМОТР →</button>
    <div id="load">ЗАГРУЗКА 0%</div>
  </div>
</div>

<script type="module">
import { drawAtom, ctaRect, setMobile, T_END, W, H } from './atom.js?v=8';
const MOBILE = matchMedia('(max-aspect-ratio: 4/5), (max-width: 699px)').matches; // выбор один раз при загрузке: видео и раскладка атома
if (MOBILE) setMobile();
const VIDEO = 'flight.mp4'; // компьютер: видео 1920, скраб перемоткой
// телефон: Safari медленно перематывает видео (лаг на iPhone 15) — вместо видео 121 кадр WebP 640×1072 (2,2 МБ) на холсте

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const sm = p => { p = clamp(p); return p * p * (3 - 2 * p); };
const eo = p => { p = clamp(p); return 1 - Math.pow(1 - p, 3); };
const $ = s => document.querySelector(s);

const vid = $('#vid'), poster = $('#poster'), flash = $('#flash'), cv = $('#atom'), ctx = cv.getContext('2d'),
      distEl = $('#dist'), distN = $('#dist .n'), hint = $('#hint'), cta = $('#cta'), prog = $('#progress'),
      bar = $('#bar'), note = $('#note'), scrim = $('#scrim'), load = $('#load');
const heads = [...document.querySelectorAll('.hd')].map(el => ({
  el, from: +el.dataset.from, to: +el.dataset.to, cap: el.querySelector('.cap'), spans: [...el.querySelectorAll('.ln span')] }));

const V_END = .55;            // видео занимает прокрутку 0 … .55, дальше держит последний кадр
const ATOM_A = .47, ATOM_B = .96; // атом стартует на влёте (стык 4,3–4,7 с закрыт вспышкой) и живёт до конца
let dur = 5.04, k = 1, ox = 0, oy = 0, dpr = 1, vis = { x0: 0, y0: 0, x1: W, y1: H };

// ── карта прокрутка → время видео. Kling разгоняет камеру неравномерно (пик +3…4 %/кадр на 85→51 м,
// толчок на кадре 79→80), поэтому линейная связь давала ступеньки. До влёта (p 0…ATOM_A ↔ 0…4,31 с)
// время идёт по накопленному приближению кадров (ORB-замер, вес = zoom% + 0,6, медиана по 3 кадрам — держит толчок 79→80 без всплеска);
// после ATOM_A — линейно, чтобы вспышка, атом и CTA остались на своих местах.
const T_IN = 4.31;
const LUT = [0.0, 0.0029, 0.00589, 0.00893, 0.01206, 0.01529, 0.01857, 0.0219, 0.02527, 0.02883, 0.03258, 0.03638, 0.04018, 0.04403, 0.04788, 0.05196, 0.05633, 0.0607, 0.06512, 0.06968, 0.07433, 0.07899, 0.08364, 0.08835, 0.0931, 0.09789, 0.10302, 0.10787, 0.11281, 0.11775, 0.12297, 0.12829, 0.13352, 0.13874, 0.14397, 0.14952, 0.15532, 0.16111, 0.16715, 0.17403, 0.18177, 0.19028, 0.19892, 0.20776, 0.21673, 0.2259, 0.23531, 0.24495, 0.25473, 0.2648, 0.27501, 0.28561, 0.29648, 0.30745, 0.31914, 0.3312, 0.34379, 0.35642, 0.36987, 0.38378, 0.39775, 0.41219, 0.4272, 0.44273, 0.45826, 0.47412, 0.49113, 0.50875, 0.5269, 0.54547, 0.56442, 0.58361, 0.60337, 0.62313, 0.6436, 0.66435, 0.68511, 0.70397, 0.72282, 0.74168, 0.75436, 0.76619, 0.77802, 0.79046, 0.80291, 0.81454, 0.82585, 0.83739, 0.84893, 0.86071, 0.87249, 0.88351, 0.89415, 0.90474, 0.91448, 0.92384, 0.93357, 0.94326, 0.95295, 0.96179, 0.97038, 0.97893, 0.98748, 0.99618, 1.0];  // доля пути до влёта на кадре i (i/24 с), последний — T_IN
function videoTime(p) {
  if (p >= ATOM_A) return Math.min(dur, T_IN + (dur - T_IN) * clamp((p - ATOM_A) / (V_END - ATOM_A)));
  const q = clamp(p / ATOM_A); let lo = 0, hi = LUT.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (LUT[m] <= q) lo = m; else hi = m; }
  const tl = lo / 24, th = hi === LUT.length - 1 ? T_IN : hi / 24;
  return tl + (th - tl) * ((q - LUT[lo]) / ((LUT[hi] - LUT[lo]) || 1));
}

// ── видео: грузим целиком в blob, чтобы скраб не ждал сеть ──
async function loadVideo() {
  try {
    const r = await fetch(VIDEO);
    const total = +r.headers.get('content-length') || 0, rd = r.body.getReader(), parts = []; let got = 0;
    for (;;) { const { done, value } = await rd.read(); if (done) break; parts.push(value); got += value.length;
      if (total) load.textContent = 'ЗАГРУЗКА ' + Math.round(got / total * 100) + '%'; }
    vid.src = URL.createObjectURL(new Blob(parts, { type: 'video/mp4' }));
  } catch (e) { vid.src = VIDEO; }
  vid.play().then(() => { vid.pause(); seek(want); }).catch(() => {}); // iOS Safari: без play() может не отдать первый кадр
  await new Promise(res => vid.readyState >= 2 ? res() : vid.addEventListener('loadeddata', res, { once: true }));
  dur = vid.duration || dur; load.remove(); poster.remove(); // сразу, без затухания: ни след «ЗАГРУЗКИ», ни постер (кадр фасада) не должны двоиться с текущим кадром
}

// ── телефон: кадры-картинки на холсте, между соседними кадрами — смешивание ──
const NF = 121, FR = 24, frames = [], seqCv = $('#seq'), sctx = seqCv.getContext('2d');
let lastF = -1;
async function loadFrames() {
  let got = 0, next = 0;
  const one = i => new Promise(res => { const im = new Image(); frames[i] = im;
    im.onload = im.onerror = () => { got++; load.textContent = 'ЗАГРУЗКА ' + Math.round(got / NF * 100) + '%'; res(); };
    im.src = 'frames-m/' + String(i).padStart(3, '0') + '.webp'; });
  await Promise.all(Array.from({ length: 6 }, async () => { while (next < NF) await one(next++); }));
  dur = NF / FR; vid.remove(); load.remove(); poster.remove();
}
function drawSeq(vt) {
  const f = clamp(vt * FR, 0, NF - 1); if (Math.abs(f - lastF) < .01) return; lastF = f;
  const i = Math.floor(f), a = f - i;
  sctx.setTransform(dpr * k, 0, 0, dpr * k, dpr * ox, dpr * oy);
  sctx.globalAlpha = 1; if (frames[i]?.complete) sctx.drawImage(frames[i], 0, 0, W, H);
  if (a > .03 && frames[i + 1]?.complete) { sctx.globalAlpha = a; sctx.drawImage(frames[i + 1], 0, 0, W, H); }
}

// ── скраб: одна перемотка за раз, последняя цель не теряется ──
let want = 0, seeking = false;
function seek(t) { want = t; if (!seeking && vid.readyState >= 1 && Math.abs(vid.currentTime - t) > .02) { seeking = true; vid.currentTime = t; } }
vid.addEventListener('seeked', () => { seeking = false; if (Math.abs(vid.currentTime - want) > .02) seek(want); });

function placeCta() {
  const r = ctaRect(vis);
  Object.assign(cta.style, { left: ox + r.x * k + 'px', top: oy + r.y * k + 'px', width: r.w * k + 'px', height: r.h * k + 'px', fontSize: Math.max(12, r.fs * k) + 'px' });
}
function resize() {
  dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  if (MOBILE) { seqCv.width = cv.width; seqCv.height = cv.height; lastF = -1; }
  k = Math.max(innerWidth / W, innerHeight / H); ox = (innerWidth - W * k) / 2; oy = (innerHeight - H * k) / 2;
  vis = { x0: -ox / k, y0: -oy / k, x1: W + ox / k, y1: H + oy / k };
  placeCta(); render(cur, true);
}
addEventListener('resize', resize);

function render(p) {
  const vt = videoTime(p);
  if (MOBILE) drawSeq(vt); else seek(vt - (p >= V_END ? .001 : 0));
  // вспышка влёта: свет из окна закрывает стык 4,3–4,7 с (импост и картина) — по реальному времени видео
  flash.style.opacity = (clamp((1 - Math.abs(vt - 4.54) / .38) * 1.6) ** .7 * .94).toFixed(3); // плато 4,40–4,68 с

  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  const ta = T_END * clamp((p - ATOM_A) / (ATOM_B - ATOM_A));
  if (p > ATOM_A) { ctx.setTransform(dpr * k, 0, 0, dpr * k, dpr * ox, dpr * oy); drawAtom(ctx, ta, vis); }

  const vis2 = h => sm((p - h.from) / .03) * (1 - sm((p - h.to + .06) / .03));
  scrim.style.opacity = Math.max(...heads.map(vis2));
  for (const h of heads) {
    const span = h.to - h.from;
    h.cap.style.opacity = vis2(h);
    h.spans.forEach((s, j) => {
      const a = eo((p - h.from - j * .012) / (span * .35));
      const e = eo((p - h.to + .045 - j * .008) / .045);
      s.style.transform = `translateY(${((1 - a) * 110 - e * 150).toFixed(2)}%)`;
      s.style.opacity = (1 - sm(e * 2.6)).toFixed(3); // уходящая строка гаснет быстро — без следа на фасаде
    });
  }
  const d = Math.round(240 * (1 - clamp(p / .46)));
  distN.firstChild.nodeValue = String(d).padStart(3, '0');
  distEl.style.opacity = 1 - sm((p - .40) / .05);
  bar.style.opacity = 1 - sm((p - .44) / .04);           // внутри бренд несёт метка атома
  note.style.opacity = (MOBILE ? 1 : .7) * (1 - sm((p - .44) / .04));
  hint.style.opacity = 1 - sm(p / .03);
  const c = sm((ta - 8.15) / .4);
  cta.style.opacity = c; cta.classList.toggle('on', c > .5);
  prog.style.width = (p * 100).toFixed(2) + '%';
}

let tgt = 0, cur = 0;
const readScroll = () => { const m = document.documentElement.scrollHeight - innerHeight; tgt = m > 0 ? clamp(scrollY / m) : 0; };
addEventListener('scroll', readScroll, { passive: true });
function loop() {
  const d = tgt - cur;
  if (Math.abs(d) > 1e-5) { cur += d * .1; render(cur); }
  requestAnimationFrame(loop);
}
// для проверки кадров: прыжок к прогрессу p, промис ждёт готовый кадр видео
window.__jump = p => new Promise(res => {
  const m = document.documentElement.scrollHeight - innerHeight; scrollTo(0, p * m); tgt = cur = p; render(p);
  const done = () => (seeking ? vid.addEventListener('seeked', () => requestAnimationFrame(done), { once: true }) : requestAnimationFrame(() => res(true)));
  done();
});
cta.addEventListener('click', () => alert('Это проба: запись на просмотр появится на настоящем сайте.'));

Promise.all([document.fonts.ready, MOBILE ? loadFrames() : loadVideo()]).then(() => { readScroll(); cur = tgt; resize(); requestAnimationFrame(loop); window.__ready = true; });
resize();
</script>
</body>
</html>
